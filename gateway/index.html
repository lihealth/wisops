<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WisOps — 智能运维知识平台</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .logo-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
    .subtitle {
      color: #94a3b8;
      font-size: 1rem;
      margin-bottom: 3rem;
      text-align: center;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 720px;
    }

    .card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 2rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #6366f1;
      box-shadow: 0 8px 32px rgba(99,102,241,0.2);
    }

    .card-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }
    .card-icon.blue  { background: linear-gradient(135deg, #3b82f6, #6366f1); }
    .card-icon.green { background: linear-gradient(135deg, #10b981, #059669); }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
    }
    .card-desc {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.6;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: auto;
    }
    .tag {
      font-size: 0.72rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: #2d3148;
      color: #a5b4fc;
    }

    .card-arrow {
      align-self: flex-end;
      color: #64748b;
      font-size: 1.2rem;
      transition: color 0.18s;
    }
    .card:hover .card-arrow { color: #6366f1; }

    footer {
      margin-top: 3rem;
      color: #475569;
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo-row">
    <div class="logo-icon">⚙️</div>
    <h1>WisOps</h1>
  </div>
  <p class="subtitle">智能运维知识融合平台 · Intelligent Operations Knowledge Platform</p>

  <div class="cards">
    <!-- Dify 知识库 -->
    <a class="card" href="http://localhost:8281" target="_blank" rel="noreferrer">
      <div class="card-icon blue">🤖</div>
      <div>
        <div class="card-title">Dify 知识库 &amp; 问答</div>
        <div class="card-desc">
          基于 RAG 的智能问答系统，管理运维知识文档，
          通过 AI 对话快速检索故障处理经验。
        </div>
      </div>
      <div class="card-tags">
        <span class="tag">RAG 检索</span>
        <span class="tag">AI 问答</span>
        <span class="tag">知识库管理</span>
      </div>
      <span class="card-arrow">→</span>
    </a>

    <!-- 图谱管理 -->
    <a class="card" href="/graph/" target="_blank" rel="noreferrer">
      <div class="card-icon green">🕸️</div>
      <div>
        <div class="card-title">故障图谱管理</div>
        <div class="card-desc">
          基于 HugeGraph 的故障-解决方案知识图谱，
          录入故障关联关系，精准查询历史处置方案。
        </div>
      </div>
      <div class="card-tags">
        <span class="tag">知识图谱</span>
        <span class="tag">故障录入</span>
        <span class="tag">方案查询</span>
      </div>
      <span class="card-arrow">→</span>
    </a>
  </div>

  <footer>
    WisOps V1.0 &nbsp;·&nbsp;
    <a href="/graph-api/docs" target="_blank" style="color:#6366f1;text-decoration:none;">Graph API 文档</a>
    &nbsp;·&nbsp;
    <a href="http://localhost:5002" target="_blank" style="color:#475569;text-decoration:none;">Dify API</a>
  </footer>
</body>
</html>
