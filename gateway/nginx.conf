server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 统一导航首页 ──
    location = / {
        try_files /index.html =404;
    }

    # ── 图谱管理前端 ──
    location /graph/ {
        proxy_pass         http://graph-ui:80/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ── 图谱 REST API ──
    location /graph-api/ {
        proxy_pass         http://graph-api:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ── Dify API（可选代理） ──
    location /dify-api/ {
        proxy_pass         http://api:5001/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
