name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  graph-api-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graph-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py

  graph-ui-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graph-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: graph-ui/package.json

      - name: Install deps
        run: npm install

      - name: Build
        run: npm run build

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose -f docker-compose.yml config > /dev/null
