server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 入口勿长期缓存：否则部署新镜像后，浏览器仍可能用旧 index 去拉旧 hash 的 JS/CSS
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Docker 内置 DNS，延迟解析 upstream
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 静态资源长缓存
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # /graph-api/<path> -> graph-api:8000/<path>
    location ~ ^/graph-api/(.*)$ {
        set $up_graph "graph-api";
        proxy_pass         http://$up_graph:8000/$1$is_args$args;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # /dify-api/<path> -> api:5001/<path>
    location ~ ^/dify-api/(.*)$ {
        set $up_dify "api";
        proxy_pass         http://$up_dify:5001/$1$is_args$args;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
