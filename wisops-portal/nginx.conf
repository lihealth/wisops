server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS，延迟解析 upstream，避免启动时找不到主机
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 静态资源长缓存
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # /graph-api/ -> graph-api 服务（rewrite 剥离前缀后再转发）
    location /graph-api/ {
        rewrite ^/graph-api/(.*) /$1 break;
        set $up_graph graph-api;
        proxy_pass         http://$up_graph:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # /dify-api/ -> Dify API 服务
    location /dify-api/ {
        rewrite ^/dify-api/(.*) /$1 break;
        set $up_dify api;
        proxy_pass         http://$up_dify:5001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
